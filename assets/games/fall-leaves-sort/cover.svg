<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#F7EEDC"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg2)"/>
  <!-- 은은한 가을 바람 선 -->
  <path d="M-20 100 C 150 70, 300 160, 480 110 T 660 140" fill="none" stroke="#E5CEAF" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <path d="M-20 160 C 180 130, 280 220, 520 170 T 660 210" fill="none" stroke="#E5CEAF" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.4"/>
  <!-- 바구니 3개 -->
  <!-- 노란 바구니 (은행) -->
  <g transform="translate(100, 200)">
    <path d="M10 40 Q 25 90, 65 90 Q 105 90, 120 40 Z" fill="#F4CA55" opacity="0.9"/>
    <rect x="5" y="35" width="120" height="12" rx="6" fill="#DEB136"/>
    <circle cx="65" cy="110" r="8" fill="#F4CA55"/>
  </g>
  <!-- 빨간 바구니 (단풍) -->
  <g transform="translate(260, 195)">
    <path d="M10 45 Q 25 95, 65 95 Q 105 95, 120 45 Z" fill="#E86850" opacity="0.9"/>
    <rect x="5" y="40" width="120" height="12" rx="6" fill="#CE4D35"/>
    <circle cx="65" cy="115" r="8" fill="#E86850"/>
  </g>
  <!-- 갈색 바구니 (참나무) -->
  <g transform="translate(420, 200)">
    <path d="M10 40 Q 25 90, 65 90 Q 105 90, 120 40 Z" fill="#B78255" opacity="0.9"/>
    <rect x="5" y="35" width="120" height="12" rx="6" fill="#996439"/>
    <circle cx="65" cy="110" r="8" fill="#B78255"/>
  </g>
  <!-- 날아다니는 아름다운 나뭇잎들 -->
  <!-- 은행잎 -->
  <g transform="translate(140, 110) rotate(-15)">
    <path d="M30 40 L30 65" stroke="#BF9019" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M30 40 Q 0 10, 15 -10 Q 30 10, 45 -10 Q 60 10, 30 40 Z" fill="#F6C83B"/>
  </g>
  <!-- 단풍잎 -->
  <g transform="translate(300, 80) rotate(10)">
    <path d="M25 40 L25 65" stroke="#9E2A18" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M25 40 L10 25 L-5 28 L5 12 L-10 0 L12 0 L25 -20 L38 0 L60 0 L45 12 L55 28 L40 25 Z" fill="#E64A2F"/>
  </g>
  <!-- 참나무잎 -->
  <g transform="translate(460, 95) rotate(-25)">
    <path d="M20 40 L20 65" stroke="#683F1C" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M20 40 C0 35, 5 20, 0 15 C-5 10, 5 0, 20 -15 C35 0, 45 10, 40 15 C35 20, 40 35, 20 40 Z" fill="#AA703E"/>
  </g>
  <!-- 타이틀 뱃지 -->
  <rect x="24" y="24" width="130" height="34" rx="17" fill="rgba(255,255,255,0.9)"/>
  <circle cx="42" cy="41" r="7" fill="#E86850"/>
  <text x="56" y="46" font-family="'Pretendard', sans-serif" font-weight="700" font-size="14" fill="#2E2E2E">낙엽 분류하기</text>
</svg>
