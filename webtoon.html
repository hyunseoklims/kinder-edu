<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>공무가 | 지니쌤의 킨더에듀</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./index.html">
      <span class="brand-logo" aria-hidden="true"><i></i><i></i><b></b></span>
      <span>지니쌤의 <strong>킨더에듀</strong></span>
    </a>
    <button class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false">☰</button>
    <nav class="site-nav">
      <a href="./index.html">홈</a>
      <a href="./play.html">놀며자라</a>
      <a href="./programs.html">프로그램</a>
      <a href="./games.html">게임</a>
      <a href="./create.html">만들기</a>
      <a class="active" href="./webtoon.html">웹툰</a>
    </nav>
  </header>

  <main class="toon-page">
    <section class="toon-hero">
      <div class="toon-title">
        <p class="kicker">ORIGINAL WEBTOON</p>
        <h1>공무가 <small>共舞歌</small></h1>
        <p>경찰 · 교사 · 소방관. 서로 다른 하루가 한 장면에서 만납니다.</p>
      </div>

      <div class="toon-trio">
        <button class="toon-person police" type="button">
          <img class="toon-person-img" src="./assets/characters/hyunseung_police.png" alt="이현승 경찰">
          <span><b>이현승</b><small>경찰</small>평범하게 살고 싶은 경찰관.</span>
        </button>
        <button class="toon-person teacher" type="button">
          <img class="toon-person-img" src="./assets/characters/jihyeon_front.png" alt="강지현 유치원 교사">
          <span><b>강지현</b><small>유치원 교사</small>자기 방식대로 오늘을 살아가는 사람.</span>
        </button>
        <button class="toon-person fire" type="button">
          <img class="toon-person-img" src="./assets/characters/youjin_fire.png" alt="서유진 소방">
          <span><b>서유진</b><small>소방</small>두 사람의 일상에 계속 끼어드는 또 한 사람.</span>
        </button>
      </div>
      <p class="pencil-note hero-hover-note">캐릭터에 마우스를 올려보세요 ↑</p>
    </section>

    <section class="toon-streams">
      <!-- 01 LOVE STORY -->
      <article class="toon-column">
        <header>
          <p>01</p>
          <h2>LOVE STORY</h2>
          <span>러브스토리</span>
        </header>
        <a class="episode latest" href="#">
          <div class="episode-art love">
            <img src="./assets/webtoon/pilot-05.png" alt="공무가 러브스토리 EP.01 작화">
          </div>
          <b>EP. 01</b>
          <h3>시작은 우연처럼</h3>
        </a>
        <a class="episode" href="#">
          <div class="episode-art love old">
            <img src="./assets/webtoon/pilot-03.png" alt="공무가 첫 만남 컷">
          </div>
          <b>PILOT CUT</b>
          <h3>첫 만남</h3>
        </a>
      </article>

      <!-- 02 DAILY -->
      <article class="toon-column">
        <header>
          <p>02</p>
          <h2>DAILY</h2>
          <span>일상</span>
        </header>
        <a class="episode latest" href="#">
          <div class="episode-art daily">
            <img src="./assets/webtoon/pilot-07.png" alt="공무가 일상 EP.01 작화">
          </div>
          <b>EP. 01</b>
          <h3>퇴근은 언제 하나요</h3>
        </a>
        <a class="episode" href="#">
          <div class="episode-art daily old">
            <img src="./assets/webtoon/pilot-01.png" alt="공무가 평범한 하루 컷">
          </div>
          <b>DAILY CUT</b>
          <h3>평범한 하루</h3>
        </a>
      </article>

      <!-- 03 PILOT -->
      <article class="toon-column">
        <header>
          <p>03</p>
          <h2>PILOT</h2>
          <span>파일럿</span>
        </header>
        <a class="episode latest" href="#">
          <div class="episode-art pilot">
            <img src="./assets/webtoon/pilot-01.png" alt="공무가 파일럿 길고양이 구조 작화">
          </div>
          <b>PILOT</b>
          <h3>길고양이 구조</h3>
        </a>
        <a class="episode" href="#">
          <div class="episode-art pilot old">
            <img src="./assets/webtoon/pilot-05.png" alt="공무가 세 사람 컷">
          </div>
          <b>PILOT CUT</b>
          <h3>세 사람</h3>
        </a>
      </article>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
