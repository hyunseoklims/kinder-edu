<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게임 | 지니쌤의 킨더에듀</title><link rel="stylesheet" href="./section-pages.css?v=20260927-match-home-frame"></head>
<body class="section-page" data-section="games"><div class="section-app"><header data-global-nav></header>
<main class="section-main game-layout sidebar-expanded" aria-label="게임">
  <aside class="section-panel game-sidebar" id="game-sidebar" aria-label="게임 검색 및 필터"></aside>
  <section class="section-panel game-surface" id="game-surface" aria-label="게임 탐색 및 실행"></section>
  <aside class="section-panel game-anim-panel" id="game-anim-panel" aria-label="캐릭터 응원 애니메이션">
    <div class="game-anim-panel__header">
      <span class="game-anim-badge">✨ PLAY TOGETHER</span>
      <h3 class="game-anim-heading">상자 톡톡 점프!</h3>
      <p class="game-anim-caption">오늘도 신나게 놀아보아요</p>
    </div>
    <div class="game-anim-stage" id="game-anim-stage" title="클릭해서 응원하기">
      <div class="game-anim-actor-wrap">
        <img id="game-character-anim-img" class="game-anim-frame" src="./assets/game-character-frame-01.png" alt="점프하는 캐릭터" width="260" height="512">
      </div>
      <div class="game-anim-ground"></div>
    </div>
    <div class="game-anim-footer">
      <button type="button" class="game-anim-cheer-btn" id="game-anim-cheer-btn">
        <span class="cheer-icon">👏</span>
        <span class="cheer-text">함께 응원하기</span>
      </button>
    </div>
  </aside>
</main>
<footer data-utility-footer></footer></div><script src="./content/section-data.js"></script><script src="./section-pages.js"></script></body></html>
