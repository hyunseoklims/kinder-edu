<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>다람쥐의 가을 준비 · KinderEdu</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#342013}body{display:flex;align-items:center;justify-content:center}#game{width:100%;height:100%;touch-action:none}canvas{display:block;touch-action:none}#controls{position:fixed;right:2%;top:3%;display:flex;gap:8px;z-index:3}button{width:clamp(42px,5vw,68px);height:clamp(42px,5vw,68px);border:3px solid #6b391d;border-radius:50%;background:linear-gradient(#f8cd83,#ba7138);color:#fff8e5;box-shadow:0 3px 0 #4e291c, inset 0 0 0 3px #ffe3a3;font-size:clamp(22px,2.5vw,32px);cursor:pointer}button:focus-visible{outline:4px solid white;outline-offset:3px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}#loading{position:fixed;color:#fff2d2;font:700 22px sans-serif;pointer-events:none}#loading[hidden]{display:none}
