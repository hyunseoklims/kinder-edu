<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>알록달록 낙엽 분류하기 | 지니쌤의 킨더에듀</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="game-wrapper">
    <div class="game-canvas">
      <!-- 상단 정보 헤더 -->
      <header class="game-header">
        <div class="header-left">
          <div class="stage-pill" id="stage-pill">1단계: 가을 길 산책 (6개)</div>
          <div class="game-score-badge">
            분류 완료: <strong id="score-text">0</strong> <span id="total-text">/ 6</span>
          </div>
        </div>
        <div class="game-guide-bubble" id="guide-bubble">
          낙엽을 터치한 뒤 어울리는 바구니를 골라보세요! 🍂
        </div>
        <button type="button" class="btn-sound" id="btn-sound-toggle" aria-label="소리 켜기/끄기">🔊</button>
      </header>

      <!-- 메인 수채화 가을 씬 -->
      <main class="scene-main">
        <!-- 수채화 공원 배경 -->
        <img src="./assets/bg.jpg" alt="가을 숲길 공원" class="scene-bg-img">

        <!-- 낙엽 보관 구역 -->
        <div class="leaves-tray-container">
          <div class="leaves-tray" id="leaves-tray"></div>
        </div>

        <!-- 하단 영역: 응원 아기 고슴도치 + 3색 수확 바구니 -->
        <div class="stage-bottom-area">
          <!-- 아기 고슴도치 캐릭터 -->
          <div class="hedgehog-companion" id="hedgehog-companion">
            <div class="hedgehog-speech" id="hedgehog-speech">낙엽을 모아줘! 🦔</div>
            <img src="./assets/hedgehog.png" alt="아기 고슴도치 친구" class="hedgehog-wc-img">
          </div>

          <!-- 3색 분류 바구니 -->
          <div class="baskets-container">
            <!-- 노란 은행잎 바구니 -->
            <div class="basket-station yellow-basket" data-type="ginkgo" tabindex="0" role="button" aria-label="노란 은행잎 바구니">
              <div class="basket-wc-wrapper">
                <img src="./assets/basket.png" alt="은행잎 바구니" class="basket-wc-img">
                <img src="./assets/leaf_ginkgo.png" alt="은행잎 견본" class="basket-leaf-sample">
              </div>
              <span class="basket-label-pill yellow">노란 은행잎 💛</span>
              <span class="basket-count-badge" id="count-ginkgo">0개 담음</span>
            </div>

            <!-- 붉은 단풍잎 바구니 -->
            <div class="basket-station red-basket" data-type="maple" tabindex="0" role="button" aria-label="붉은 단풍잎 바구니">
              <div class="basket-wc-wrapper">
                <img src="./assets/basket.png" alt="단풍잎 바구니" class="basket-wc-img">
                <img src="./assets/leaf_maple.png" alt="단풍잎 견본" class="basket-leaf-sample">
              </div>
              <span class="basket-label-pill red">붉은 단풍잎 ❤️</span>
              <span class="basket-count-badge" id="count-maple">0개 담음</span>
            </div>

            <!-- 갈색 참나무잎 바구니 -->
            <div class="basket-station brown-basket" data-type="oak" tabindex="0" role="button" aria-label="갈색 참나무잎 바구니">
              <div class="basket-wc-wrapper">
                <img src="./assets/basket.png" alt="참나무잎 바구니" class="basket-wc-img">
                <img src="./assets/leaf_oak.png" alt="참나무잎 견본" class="basket-leaf-sample">
              </div>
              <span class="basket-label-pill brown">갈색 참나무잎 🤎</span>
              <span class="basket-count-badge" id="count-oak">0개 담음</span>
            </div>
          </div>
        </div>

        <!-- 축하 오버레이 모달 -->
        <div class="celebration-overlay" id="celebration-overlay" hidden>
          <div class="celebration-card">
            <div class="celebration-badge">🎉 참 잘했어요! 🎉</div>
            <h2 id="cleared-title">낙엽 분류 완성!</h2>
            <p id="cleared-desc">알록달록 예쁜 가을 낙엽들이 알맞은 바구니에 쏙 들어갔어요!</p>
            <div class="celebration-stars" id="cleared-stars">⭐⭐⭐</div>
            <button type="button" class="btn-next" id="btn-next-stage">다음 단계로! ▶</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../shared/game-bridge.js"></script>
  <script src="./src/game.js"></script>
</body>
</html>
