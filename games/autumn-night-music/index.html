<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>가을밤 풀벌레 음악대 | Kinder Edu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #FAF4E5; font-family: 'Pretendard', sans-serif; }
    .game-wrapper { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 10px; }
    .game-canvas {
      width: 100%; max-width: 1000px; height: 100%; max-height: 660px; aspect-ratio: 1000 / 660;
      background: linear-gradient(180deg, #1B2238 0%, #293659 70%, #151A2C 100%);
      border-radius: 20px; box-shadow: 0 16px 40px rgba(0,0,0,0.3);
      display: flex; flex-direction: column; position: relative; overflow: hidden; color: #FFF;
    }
    .header { height: 60px; padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.1); backdrop-filter: blur(8px); }
    .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
    .moon { position: absolute; top: 30px; right: 80px; width: 80px; height: 80px; border-radius: 50%; background: #FFF3B8; box-shadow: 0 0 30px #FFF3B8; }
    .xylophone { display: flex; gap: 16px; align-items: flex-end; z-index: 10; padding: 20px; }
    .key-bar {
      width: 75px; border-radius: 16px; border: none; cursor: pointer; color: #FFF; font-weight: 800; font-size: 20px;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3); transition: transform 0.1s, filter 0.1s;
    }
    .key-bar:active, .key-bar.active { transform: scale(0.94); filter: brightness(1.3); }
    .k-do { height: 240px; background: #E86850; }
    .k-re { height: 210px; background: #DFB64F; }
    .k-mi { height: 180px; background: #7DBB91; }
    .k-sol { height: 150px; background: #6898C8; }
    .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 20; }
    .overlay[hidden] { display: none; }
    .card-modal { background: #FFF; color: #2E2E2E; padding: 32px 40px; border-radius: 20px; text-align: center; }
    .btn-res { background: #DFB64F; color: #FFF; border: none; padding: 10px 28px; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="game-canvas">
      <header class="header">
        <div style="font-weight:700;">🦗 나뭇잎 실로폰 건반을 눌러 가을 노래를 연주해보세요!</div>
        <div id="play-count" style="font-weight:700; color:#FFDF78;">연주: 0 / 8음</div>
      </header>
      <main class="stage">
        <div class="moon"></div>
        <div class="xylophone">
          <button class="key-bar k-do" data-note="261.63">도</button>
          <button class="key-bar k-re" data-note="293.66">레</button>
          <button class="key-bar k-mi" data-note="329.63">미</button>
          <button class="key-bar k-sol" data-note="392.00">솔</button>
        </div>
        <div class="overlay" id="overlay" hidden>
          <div class="card-modal">
            <div style="font-size:42px; margin-bottom:10px;">🎵 🦗 🎶</div>
            <h2 style="color:#D47A2A; margin-bottom:8px;">멋진 풀벌레 음악회 완성!</h2>
            <p style="color:#7E7872; font-size:14px;">가을밤을 밝히는 아름다운 연주였어요!</p>
            <button class="btn-res" id="btn-restart">다시 연주하기</button>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="../shared/game-bridge.js"></script>
  <script>
    (function(){
      var bridge = window.KinderGameBridge ? window.KinderGameBridge.createGameClient('autumn-night-music') : null;
      var audioCtx = null;
      function playTone(freq){
        if(bridge && bridge.isMuted()) return;
        try{
          if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if(audioCtx.state === 'suspended') audioCtx.resume();
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.6);
        }catch(_){}
      }

      var noteCount = 0;
      var score = document.getElementById('play-count');
      var overlay = document.getElementById('overlay');

      document.querySelectorAll('.key-bar').forEach(function(bar){
        bar.onclick = function(){
          playTone(parseFloat(bar.dataset.note));
          noteCount++;
          score.textContent = '연주: ' + noteCount + ' / 8음';
          if(noteCount >= 8){
            setTimeout(function(){
              overlay.hidden = false;
              if(bridge) bridge.complete({ notes: noteCount });
            }, 500);
          }
        };
      });

      document.getElementById('btn-restart').onclick = function(){
        noteCount = 0;
        score.textContent = '연주: 0 / 8음';
        overlay.hidden = true;
      };

      if(bridge){
        bridge.on('HOST_RESTART', function(){
          noteCount = 0;
          score.textContent = '연주: 0 / 8음';
          overlay.hidden = true;
        });
        bridge.ready();
      }
    })();
  </script>
</body>
</html>
