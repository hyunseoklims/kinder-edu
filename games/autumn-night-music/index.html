<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>가을밤 풀벌레 음악대 | Kinder Edu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #FAF4E5; font-family: 'Pretendard', -apple-system, sans-serif;
      color: #FFF;
    }
    .game-wrapper {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 8px;
    }
    .game-canvas {
      width: 100%; max-width: 1000px; height: 100%; max-height: 660px; aspect-ratio: 1000 / 660;
      border-radius: 20px; box-shadow: 0 16px 45px rgba(0, 0, 0, 0.4);
      position: relative; overflow: hidden; display: flex; flex-direction: column;
      background: radial-gradient(circle at 80% 20%, #2A365E 0%, #151A2E 70%, #0D101E 100%);
    }

    /* 상단 헤더 */
    .game-header {
      height: 56px; padding: 8px 18px; display: flex; align-items: center; justify-content: space-between;
      background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15); z-index: 20;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .mode-tabs { display: flex; gap: 6px; }
    .mode-btn {
      background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.25);
      color: #FFF; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
      cursor: pointer; transition: all 0.15s ease;
    }
    .mode-btn.is-active {
      background: #DFB64F; border-color: #DFB64F; color: #1E1A11; box-shadow: 0 2px 8px rgba(223, 182, 79, 0.4);
    }
    .song-pill {
      background: rgba(255, 255, 255, 0.15); padding: 5px 12px; border-radius: 999px;
      font-size: 13px; font-weight: 700; color: #FFE082;
    }
    .guide-bubble {
      background: rgba(255, 255, 255, 0.18); padding: 6px 16px; border-radius: 999px;
      font-size: 13.5px; font-weight: 600; color: #FFF; backdrop-filter: blur(4px);
    }
    .btn-sound {
      background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.25);
      width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 15px; color: #FFF;
      display: grid; place-items: center;
    }

    /* 밤하늘 무대 */
    .music-stage {
      flex: 1; position: relative; display: flex; flex-direction: column; justify-content: space-between;
      padding: 16px 20px 24px; overflow: hidden;
    }

    /* 보름달 & 별빛 */
    .moon {
      position: absolute; top: 20px; right: 60px; width: 85px; height: 85px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #FFFDF0 0%, #FFE082 80%, #FFCA28 100%);
      box-shadow: 0 0 35px rgba(255, 224, 130, 0.75), inset -8px -8px 14px rgba(230, 160, 40, 0.3);
      pointer-events: none;
    }
    .firefly {
      position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #FFEB3B;
      box-shadow: 0 0 12px #FFEB3B; animation: fireflyFloat 4s infinite ease-in-out;
      pointer-events: none;
    }
    @keyframes fireflyFloat {
      0%, 100% { transform: translateY(0) scale(0.8); opacity: 0.3; }
      50% { transform: translateY(-16px) scale(1.3); opacity: 1; }
    }

    /* 풀벌레 친구들 밴드 (귀뚜라미 & 방울벌레) */
    .bugs-band {
      display: flex; justify-content: space-between; align-items: flex-end; padding: 0 40px;
      height: 120px; position: relative; z-index: 5;
    }
    .bug-item {
      display: flex; flex-direction: column; align-items: center; cursor: pointer;
      transition: transform 0.2s ease;
    }
    .bug-item:hover { transform: scale(1.1); }
    .bug-item.playing {
      animation: bugPlayHop 0.4s ease;
    }
    @keyframes bugPlayHop {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15) translateY(-14px); }
    }
    .bug-svg { width: 80px; height: 80px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5)); }
    .bug-speech {
      background: rgba(255, 255, 255, 0.9); color: #1E1A11; font-size: 11.5px; font-weight: 800;
      padding: 3px 8px; border-radius: 999px; margin-bottom: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    /* 8음 나뭇잎 실로폰 */
    .xylophone-container {
      display: flex; flex-direction: column; align-items: center; position: relative; z-index: 10;
    }
    .xylophone-frame {
      display: flex; gap: 10px; align-items: flex-end; justify-content: center;
      background: rgba(30, 20, 10, 0.45); padding: 18px 24px 16px; border-radius: 24px;
      border: 2px solid rgba(220, 180, 120, 0.3); box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }

    .leaf-key {
      border: 0; cursor: pointer; border-radius: 16px; padding: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      position: relative; transition: transform 0.1s cubic-bezier(0.18, 0.89, 0.32, 1.28), filter 0.1s;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    }
    .leaf-key:hover { transform: translateY(-4px); filter: brightness(1.15); }
    .leaf-key:active, .leaf-key.hit {
      transform: translateY(2px) scale(0.96); filter: brightness(1.35);
    }
    .leaf-key.target-guide {
      animation: keyGuidePulse 0.9s infinite alternate;
    }
    @keyframes keyGuidePulse {
      0% { box-shadow: 0 0 0 2px #FFE082, 0 6px 16px rgba(0,0,0,0.3); }
      100% { box-shadow: 0 0 0 6px #FFE082, 0 0 20px #FFCA28; }
    }

    .key-note-name {
      font-size: 17px; font-weight: 800; color: #FFF; margin-bottom: 12px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }
    .key-solfege {
      font-size: 11px; font-weight: 700; color: rgba(255, 255, 255, 0.85); margin-bottom: 6px;
    }

    /* 8음 건반 높이 & 나뭇잎 그라데이션 */
    .k-c4 { width: 68px; height: 230px; background: linear-gradient(180deg, #EF5350, #C62828); }
    .k-d4 { width: 68px; height: 215px; background: linear-gradient(180deg, #FF7043, #D84315); }
    .k-e4 { width: 68px; height: 200px; background: linear-gradient(180deg, #FFA726, #EF6C00); }
    .k-f4 { width: 68px; height: 185px; background: linear-gradient(180deg, #66BB6A, #2E7D32); }
    .k-g4 { width: 68px; height: 170px; background: linear-gradient(180deg, #26A69A, #00695C); }
    .k-a4 { width: 68px; height: 155px; background: linear-gradient(180deg, #42A5F5, #1565C0); }
    .k-b4 { width: 68px; height: 140px; background: linear-gradient(180deg, #7E57C2, #4527A0); }
    .k-c5 { width: 68px; height: 125px; background: linear-gradient(180deg, #AB47BC, #6A1B9A); }

    /* 축하 모달 */
    .celebration-overlay {
      position: absolute; inset: 0; background: rgba(10, 15, 28, 0.7);
      backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 50;
    }
    .celebration-overlay[hidden] { display: none; }
    .celebration-card {
      width: min(440px, 90%); background: #1B233D; border: 3px solid #FFE082;
      border-radius: 24px; padding: 32px 28px; text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5); color: #FFF;
    }
    .celebration-card h2 { font-size: 24px; color: #FFE082; margin-bottom: 8px; }
    .celebration-card p { font-size: 14px; color: #B0BEC5; line-height: 1.55; margin-bottom: 20px; }
    .btn-next {
      padding: 11px 26px; background: #DFB64F; color: #1E1A11; border: 0;
      border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer;
      box-shadow: 0 4px 14px rgba(223, 182, 79, 0.4);
    }
    .btn-next:hover { background: #CA9F32; }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="game-canvas">
      <!-- 헤더 바 -->
      <header class="game-header">
        <div class="header-left">
          <div class="mode-tabs">
            <button type="button" class="mode-btn is-active" id="btn-mode-free">자유 연주 🎶</button>
            <button type="button" class="mode-btn" id="btn-mode-song">따라 부르기 🌟</button>
          </div>
          <div class="song-pill" id="song-pill" style="display:none;">곡: 비행기 ✈️</div>
        </div>
        <div class="guide-bubble" id="guide-bubble">
          나뭇잎 실로폰을 톡톡 연주해보세요! 풀벌레 친구들이 노래해요 🦗
        </div>
        <button type="button" class="btn-sound" id="btn-sound-toggle" aria-label="소리 켜기/끄기">🔊</button>
      </header>

      <!-- 밤하늘 무대 -->
      <main class="music-stage">
        <!-- 달 & 반딧불이 -->
        <div class="moon"></div>
        <div class="firefly" style="top:25%; left:20%;"></div>
        <div class="firefly" style="top:35%; left:65%; animation-delay:1.5s;"></div>
        <div class="firefly" style="top:18%; left:45%; animation-delay:0.8s;"></div>

        <!-- 풀벌레 친구들 밴드 -->
        <div class="bugs-band">
          <!-- 귀뚜라미 바이올린 -->
          <div class="bug-item" id="bug-cricket">
            <span class="bug-speech" id="cricket-speech">귀뚤귀뚤~🎻</span>
            <svg class="bug-svg" viewBox="0 0 80 80">
              <!-- 몸통 -->
              <ellipse cx="40" cy="46" rx="20" ry="12" fill="#558B2F" transform="rotate(-10 40 46)"/>
              <ellipse cx="28" cy="40" rx="10" ry="8" fill="#689F38"/>
              <!-- 눈 -->
              <circle cx="24" cy="38" r="2.5" fill="#212121"/>
              <circle cx="25" cy="37" r="1" fill="#FFF"/>
              <!-- 긴 더듬이 -->
              <path d="M22 36 Q10 20 5 15 M24 35 Q18 16 16 10" stroke="#8BC34A" stroke-width="2" fill="none" stroke-linecap="round"/>
              <!-- 바이올린 -->
              <path d="M42 42 Q50 36 55 42 Q50 48 42 42 Z" fill="#8D6E63"/>
              <line x1="38" y1="36" x2="52" y2="48" stroke="#D7CCC8" stroke-width="1.8"/>
              <!-- 뒷다리 -->
              <path d="M48 48 Q60 30 65 55" stroke="#33691E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            </svg>
          </div>

          <!-- 방울벌레 방울 -->
          <div class="bug-item" id="bug-bell">
            <span class="bug-speech" id="bell-speech">방울방울~🔔</span>
            <svg class="bug-svg" viewBox="0 0 80 80">
              <!-- 둥근 몸통 -->
              <ellipse cx="42" cy="48" rx="16" ry="14" fill="#33691E"/>
              <ellipse cx="50" cy="44" rx="9" ry="8" fill="#558B2F"/>
              <!-- 눈 -->
              <circle cx="53" cy="42" r="2.5" fill="#212121"/>
              <circle cx="54" cy="41" r="1" fill="#FFF"/>
              <!-- 황금 방울 -->
              <circle cx="30" cy="52" r="7" fill="#FFD54F"/>
              <circle cx="30" cy="52" r="2" fill="#FF8F00"/>
              <!-- 더듬이 -->
              <path d="M52 38 Q62 25 65 18 M54 39 Q66 30 72 26" stroke="#8BC34A" stroke-width="2" fill="none" stroke-linecap="round"/>
            </svg>
          </div>
        </div>

        <!-- 8음 나뭇잎 실로폰 -->
        <div class="xylophone-container">
          <div class="xylophone-frame">
            <button type="button" class="leaf-key k-c4" data-index="0" data-note="261.63">
              <span class="key-solfege">C4</span>
              <span class="key-note-name">도</span>
            </button>
            <button type="button" class="leaf-key k-d4" data-index="1" data-note="293.66">
              <span class="key-solfege">D4</span>
              <span class="key-note-name">레</span>
            </button>
            <button type="button" class="leaf-key k-e4" data-index="2" data-note="329.63">
              <span class="key-solfege">E4</span>
              <span class="key-note-name">미</span>
            </button>
            <button type="button" class="leaf-key k-f4" data-index="3" data-note="349.23">
              <span class="key-solfege">F4</span>
              <span class="key-note-name">파</span>
            </button>
            <button type="button" class="leaf-key k-g4" data-index="4" data-note="392.00">
              <span class="key-solfege">G4</span>
              <span class="key-note-name">솔</span>
            </button>
            <button type="button" class="leaf-key k-a4" data-index="5" data-note="440.00">
              <span class="key-solfege">A4</span>
              <span class="key-note-name">라</span>
            </button>
            <button type="button" class="leaf-key k-b4" data-index="6" data-note="493.88">
              <span class="key-solfege">B4</span>
              <span class="key-note-name">시</span>
            </button>
            <button type="button" class="leaf-key k-c5" data-index="7" data-note="523.25">
              <span class="key-solfege">C5</span>
              <span class="key-note-name">높은도</span>
            </button>
          </div>
        </div>

        <!-- 축하 오버레이 -->
        <div class="celebration-overlay" id="celebration-overlay" hidden>
          <div class="celebration-card">
            <div style="font-size:46px; margin-bottom:8px;">🎵 🦗 🌙</div>
            <h2 id="cleared-title">아름다운 연주 완성!</h2>
            <p id="cleared-desc">가을밤 달빛 아래 풀벌레 친구들과 환상적인 하모니를 만들었어요!</p>
            <div style="font-size:32px; margin-bottom:20px; letter-spacing:4px;">⭐⭐⭐</div>
            <button type="button" class="btn-next" id="btn-next-song">다음 곡 연주하기! ▶</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../shared/game-bridge.js"></script>
  <script>
    (function(){
      'use strict';
      var bridge = window.KinderGameBridge ? window.KinderGameBridge.createGameClient('autumn-night-music') : null;

      var audioCtx = null;
      function getAudioContext() {
        if (!audioCtx) {
          var AudioClass = window.AudioContext || window.webkitAudioContext;
          if (AudioClass) audioCtx = new AudioClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
      }

      // 맑고 울림 있는 어쿠스틱 마림바 사운드 합성
      function playMarimbaTone(freq) {
        if (bridge && bridge.isMuted()) return;
        try {
          var ctx = getAudioContext();
          if (!ctx) return;

          // 1. 기음 (삼각파)
          var osc1 = ctx.createOscillator();
          var gain1 = ctx.createGain();
          osc1.type = 'triangle';
          osc1.frequency.setValueAtTime(freq, ctx.currentTime);

          // 2. 맑은 상음 (배음 벨 톤)
          var osc2 = ctx.createOscillator();
          var gain2 = ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(freq * 2.76, ctx.currentTime);

          gain1.gain.setValueAtTime(0.35, ctx.currentTime);
          gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);

          gain2.gain.setValueAtTime(0.15, ctx.currentTime);
          gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);

          osc1.connect(gain1); gain1.connect(ctx.destination);
          osc2.connect(gain2); gain2.connect(ctx.destination);

          osc1.start(); osc2.start();
          osc1.stop(ctx.currentTime + 0.6); osc2.stop(ctx.currentTime + 0.3);
        } catch(_) {}
      }

      function playFanfare() {
        if (bridge && bridge.isMuted()) return;
        try {
          var ctx = getAudioContext();
          if (!ctx) return;
          [261.63, 329.63, 392.00, 523.25, 659.25].forEach(function(f, i) {
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.12);
            gain.gain.setValueAtTime(0.25, ctx.currentTime + i * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.45);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.12);
            osc.stop(ctx.currentTime + i * 0.12 + 0.45);
          });
        } catch(_) {}
      }

      // 동요 멜로디 (인덱스: 0=도, 1=레, 2=미, 3=파, 4=솔, 5=라, 6=시, 7=높은도)
      var SONGS = [
        {
          title: '비행기 ✈️',
          notes: [2, 1, 0, 1, 2, 2, 2, 1, 1, 1, 2, 4, 4] // 미레도레미미미 레레레 미솔솔
        },
        {
          title: '반짝반짝 작은 별 ⭐',
          notes: [0, 0, 4, 4, 5, 5, 4, 3, 3, 2, 2, 1, 1, 0] // 도도솔솔라라솔 파파미미레레도
        },
        {
          title: '도레미 송 🎵',
          notes: [0, 1, 2, 0, 2, 0, 2, 1, 2, 3, 3, 2, 1, 3]
        }
      ];

      var mode = 'free'; // 'free' or 'song'
      var currentSongIdx = 0;
      var songStep = 0;

      var btnModeFree = document.getElementById('btn-mode-free');
      var btnModeSong = document.getElementById('btn-mode-song');
      var songPill = document.getElementById('song-pill');
      var guideBubble = document.getElementById('guide-bubble');
      var bugCricket = document.getElementById('bug-cricket');
      var bugBell = document.getElementById('bug-bell');
      var cricketSpeech = document.getElementById('cricket-speech');
      var bellSpeech = document.getElementById('bell-speech');
      var overlay = document.getElementById('celebration-overlay');
      var btnNextSong = document.getElementById('btn-next-song');
      var btnSound = document.getElementById('btn-sound-toggle');
      var keys = document.querySelectorAll('.leaf-key');

      function switchMode(newMode) {
        mode = newMode;
        keys.forEach(function(k) { k.classList.remove('target-guide'); });
        overlay.hidden = true;

        if (mode === 'free') {
          btnModeFree.classList.add('is-active');
          btnModeSong.classList.remove('is-active');
          songPill.style.display = 'none';
          guideBubble.textContent = '나뭇잎 실로폰을 톡톡 연주해보세요! 풀벌레 친구들이 노래해요 🦗';
        } else {
          btnModeFree.classList.remove('is-active');
          btnModeSong.classList.add('is-active');
          songPill.style.display = 'inline-block';
          startSong(0);
        }
      }

      function startSong(songIdx) {
        currentSongIdx = songIdx % SONGS.length;
        songStep = 0;
        var song = SONGS[currentSongIdx];
        songPill.textContent = '곡: ' + song.title;
        guideBubble.textContent = '반짝이는 나뭇잎 건반을 차례대로 눌러보세요! ⭐';
        highlightTargetKey();
      }

      function highlightTargetKey() {
        keys.forEach(function(k) { k.classList.remove('target-guide'); });
        if (mode !== 'song') return;
        var song = SONGS[currentSongIdx];
        if (songStep < song.notes.length) {
          var targetIdx = song.notes[songStep];
          var targetKey = document.querySelector('.leaf-key[data-index="' + targetIdx + '"]');
          if (targetKey) targetKey.classList.add('target-guide');
        }
      }

      function hitKey(key) {
        var freq = parseFloat(key.dataset.note);
        var idx = parseInt(key.dataset.index, 10);

        playMarimbaTone(freq);
        key.classList.add('hit');
        setTimeout(function() { key.classList.remove('hit'); }, 150);

        // 풀벌레 반응
        if (idx % 2 === 0) {
          bugCricket.classList.add('playing');
          cricketSpeech.textContent = '귀뚤~♪';
          setTimeout(function() { bugCricket.classList.remove('playing'); }, 400);
        } else {
          bugBell.classList.add('playing');
          bellSpeech.textContent = '방울~♬';
          setTimeout(function() { bugBell.classList.remove('playing'); }, 400);
        }

        // 동요 따라하기 모드 처리
        if (mode === 'song') {
          var song = SONGS[currentSongIdx];
          var targetIdx = song.notes[songStep];

          if (idx === targetIdx) {
            songStep++;
            if (songStep >= song.notes.length) {
              // 곡 완성!
              keys.forEach(function(k) { k.classList.remove('target-guide'); });
              setTimeout(showSongClear, 450);
            } else {
              highlightTargetKey();
            }
          }
        }
      }

      keys.forEach(function(key) {
        key.addEventListener('click', function() {
          hitKey(key);
        });
      });

      function showSongClear() {
        playFanfare();
        var song = SONGS[currentSongIdx];
        overlay.hidden = false;
        document.getElementById('cleared-title').textContent = song.title + ' 완주 성공!';
        document.getElementById('cleared-desc').textContent = '달빛 아래 풀벌레 오케스트라와 멋진 동요를 완성했어요!';

        if (bridge) bridge.reportScore(100);
      }

      btnModeFree.addEventListener('click', function() { switchMode('free'); });
      btnModeSong.addEventListener('click', function() { switchMode('song'); });

      btnNextSong.addEventListener('click', function() {
        overlay.hidden = true;
        startSong(currentSongIdx + 1);
      });

      btnSound.addEventListener('click', function() {
        var muted = (bridge && typeof bridge.toggleSound === 'function') ? bridge.toggleSound() : false;
        btnSound.textContent = muted ? '🔇' : '🔊';
      });

      if (bridge && typeof bridge.onRestart === 'function') {
        bridge.onRestart(function() {
          if (mode === 'song') startSong(currentSongIdx);
          else switchMode('free');
        });
      }
      if (bridge && typeof bridge.onMuteChange === 'function') {
        bridge.onMuteChange(function(muted) { btnSound.textContent = muted ? '🔇' : '🔊'; });
      }

      switchMode('free');
    })();
  </script>
</body>
</html>
