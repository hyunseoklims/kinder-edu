<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>가을밤 풀벌레 음악대 | 지니쌤의 킨더에듀</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="game-wrapper">
    <div class="game-canvas">
      <!-- 헤더 바 -->
      <header class="game-header">
        <div class="header-left">
          <div class="mode-tabs">
            <button type="button" class="mode-btn is-active" id="btn-mode-free">자유 연주 🎶</button>
            <button type="button" class="mode-btn" id="btn-mode-song">따라 부르기 🌟</button>
          </div>
          <div class="song-pill" id="song-pill" style="display:none;">곡: 비행기 ✈️</div>
        </div>
        <div class="guide-bubble" id="guide-bubble">
          나뭇잎 실로폰을 톡톡 연주해보세요! 풀벌레 친구들이 노래해요 🦗
        </div>
        <button type="button" class="btn-sound" id="btn-sound-toggle" aria-label="소리 켜기/끄기">🔊</button>
      </header>

      <!-- 밤하늘 음악 무대 -->
      <main class="music-stage">
        <!-- 보름달 & 반딧불이 (Rule 1) -->
        <div class="moon"></div>
        <div class="firefly" style="top:22%; left:18%;"></div>
        <div class="firefly" style="top:32%; left:68%; animation-delay:1.5s;"></div>
        <div class="firefly" style="top:16%; left:48%; animation-delay:0.8s;"></div>

        <!-- 풀벌레 친구들 밴드 (Rule 2) -->
        <div class="bugs-band">
          <!-- 귀뚜라미 바이올린 -->
          <div class="bug-item" id="bug-cricket" role="button" aria-label="귀뚜라미 연주자">
            <span class="bug-speech" id="cricket-speech">귀뚤귀뚤~🎻</span>
            <svg class="bug-svg" viewBox="0 0 80 80">
              <ellipse cx="40" cy="46" rx="20" ry="12" fill="#558B2F" transform="rotate(-10 40 46)"/>
              <ellipse cx="26" cy="38" rx="10" ry="9" fill="#689F38"/>
              <circle cx="23" cy="35" r="2.5" fill="#FFF"/>
              <circle cx="23" cy="35" r="1.2" fill="#2E7D32"/>
              <path d="M22 30 Q16 12 10 10" stroke="#33691E" stroke-width="1.8" fill="none"/>
              <path d="M26 30 Q22 10 18 6" stroke="#33691E" stroke-width="1.8" fill="none"/>
              <path d="M42 40 L52 28 L62 38" stroke="#8D6E63" stroke-width="3" fill="#D7CCC8" stroke-linejoin="round"/>
              <line x1="38" y1="36" x2="66" y2="34" stroke="#D7CCC8" stroke-width="2"/>
            </svg>
          </div>

          <!-- 방울벌레 실로폰 지휘자 -->
          <div class="bug-item" id="bug-bell" role="button" aria-label="방울벌레 지휘자">
            <span class="bug-speech" id="bell-speech">또르르~🔔</span>
            <svg class="bug-svg" viewBox="0 0 80 80">
              <ellipse cx="40" cy="48" rx="16" ry="18" fill="#3E2723"/>
              <ellipse cx="40" cy="48" rx="13" ry="15" fill="#5D4037"/>
              <circle cx="40" cy="28" r="9" fill="#4E342E"/>
              <circle cx="36" cy="27" r="2" fill="#FFF"/>
              <circle cx="44" cy="27" r="2" fill="#FFF"/>
              <circle cx="36" cy="27" r="1" fill="#000"/>
              <circle cx="44" cy="27" r="1" fill="#000"/>
              <path d="M38 20 Q30 8 26 4" stroke="#3E2723" stroke-width="1.6" fill="none"/>
              <path d="M42 20 Q50 8 54 4" stroke="#3E2723" stroke-width="1.6" fill="none"/>
              <!-- 지휘봉 -->
              <line x1="48" y1="42" x2="68" y2="28" stroke="#FFD54F" stroke-width="2.5" stroke-linecap="round"/>
              <circle cx="68" cy="28" r="3.5" fill="#FFF"/>
            </svg>
          </div>
        </div>

        <!-- 8음 나뭇잎 실로폰 건반 -->
        <div class="xylophone-container">
          <div class="xylophone-frame" id="xylophone-frame"></div>
        </div>

        <!-- 축하 모달 -->
        <div class="celebration-overlay" id="celebration-overlay" hidden>
          <div class="celebration-card">
            <div class="celebration-badge">🎶 연주 완성! 🎶</div>
            <h2 id="cleared-title">동요 완곡 대성공!</h2>
            <p id="cleared-desc">풀벌레 친구들과 함께 가을밤 아름다운 하모니를 만들었어요!</p>
            <button type="button" class="btn-next" id="btn-next-stage">다음 동요 연주하기 ▶</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../shared/game-bridge.js"></script>
  <script src="./src/game.js"></script>
</body>
</html>
