<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>다람쥐의 도토리 모으기 | Kinder Edu</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="game-wrapper">
    <div id="game-canvas-container" class="game-canvas">
      <!-- 상단 헤더 바 -->
      <header class="game-header">
        <div class="header-left">
          <div class="stage-pill">
            <span class="stage-star" id="stage-stars">⭐☆☆</span>
            <span class="stage-title" id="stage-title">1단계: 숲속 잔디밭</span>
          </div>
          <div class="game-counter">
            <span class="counter-icon-svg">
              <svg viewBox="0 0 32 32" width="22" height="22"><path d="M16 3 C12 3 7 7 7 13 C7 14 8 15 9 15 L23 15 C24 15 25 14 25 13 C25 7 20 3 16 3 Z" fill="#7A4B26"/><path d="M15 1 L16 3 L17 1 Z" stroke="#5A3215" stroke-width="2"/><path d="M9 15 C8 19 11 28 16 30 C21 28 24 19 23 15 Z" fill="#D4863B"/><ellipse cx="14" cy="20" rx="2" ry="4" fill="#F3B36E" opacity="0.6"/></svg>
            </span>
            <span class="counter-label">도토리:</span>
            <strong id="collected-count">0</strong> <span class="counter-total" id="total-count">/ 5</span>
          </div>
        </div>

        <div class="game-status-bubble" id="status-bubble">
          낙엽 속에 숨은 도토리를 찾아 톡톡 눌러보세요!
        </div>

        <div class="header-right">
          <button type="button" class="btn-sound" id="btn-sound-toggle" aria-label="소리 켜기/끄기">🔊</button>
        </div>
      </header>

      <!-- 게임 인터랙티브 씬 -->
      <main class="scene-stage" id="scene-stage">
        <!-- 수채화 가을 숲 배경 이미지 (Rule 1) -->
        <img src="./assets/bg.jpg" class="scene-bg-img" alt="가을 숲 풍경" aria-hidden="true">

        <!-- 흩날리는 낙엽 레이어 -->
        <div class="drifting-leaves-layer" id="drifting-leaves" aria-hidden="true"></div>

        <!-- 바닥 낙엽 및 숨겨진 인터랙티브 도토리 컨테이너 (Rule 6: 64px+ 히트박스) -->
        <div class="ground-interactive-area" id="ground-area">
          <!-- 도토리 및 낙엽 오브젝트가 JS로 스폰됨 -->
        </div>

        <!-- 감성 수채화 다람쥐 캐릭터 & 바구니 (Rule 2) -->
        <div class="squirrel-station" id="squirrel-station">
          <div class="speech-bubble-pop" id="squirrel-speech">도토리를 모아줘! 🌰</div>
          <div class="squirrel-character" id="squirrel-char" tabindex="0" role="button" aria-label="다람쥐 캐릭터">
            <img src="./assets/squirrel.png" class="squirrel-wc-img" alt="귀여운 수채화 아기 다람쥐">
          </div>

          <!-- 도토리 바구니 (Rule 3) -->
          <div class="basket-container" id="basket-container">
            <img src="./assets/basket.png" class="basket-wc-img" alt="수확 바구니">
            <!-- 바구니에 들어간 도토리 아이콘들 -->
            <div class="basket-fill-items" id="basket-fill-items"></div>
          </div>
        </div>

        <!-- 성공 축하 오버레이 모달 -->
        <div class="celebration-overlay" id="celebration-overlay" hidden>
          <div class="celebration-card">
            <div class="confetti-cannon" id="confetti-container"></div>
            <div class="celebration-badge">🎉 참 잘했어요! 🎉</div>
            <h2 id="celebration-title">숲속 도토리를 모두 모았어요!</h2>
            <p id="celebration-desc">다람쥐가 활짝 웃으며 고마워해요! 겨울 양식이 든든해졌어요.</p>
            <div class="star-rating" id="celebration-stars">⭐⭐⭐</div>
            <div class="celebration-buttons">
              <button type="button" class="btn-primary" id="btn-next-stage">다음 단계로! ▶</button>
              <button type="button" class="btn-secondary" id="btn-retry-stage">이 단계 다시 하기 ↺</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../shared/game-bridge.js"></script>
  <script src="./src/game.js"></script>
</body>
</html>
