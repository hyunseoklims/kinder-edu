<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>가을 과수원 열매 수확 | Kinder Edu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #FAF4E5; font-family: 'Pretendard', -apple-system, sans-serif;
      color: #2E2E2E;
    }
    .game-wrapper {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 8px;
    }
    .game-canvas {
      width: 100%; max-width: 1000px; height: 100%; max-height: 660px; aspect-ratio: 1000 / 660;
      border-radius: 20px; box-shadow: 0 16px 45px rgba(110, 85, 45, 0.16);
      position: relative; overflow: hidden; display: flex; flex-direction: column;
      background: linear-gradient(180deg, #E6F3FA 0%, #F5FBFD 50%, #E8F4DC 100%);
    }

    /* 상단 정보 바 */
    .game-header {
      height: 56px; padding: 8px 18px; display: flex; align-items: center; justify-content: space-between;
      background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(220, 190, 150, 0.35); z-index: 20;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .stage-pill {
      background: #E8F5E9; border: 1px solid #A5D6A7; padding: 4px 12px; border-radius: 999px;
      font-size: 13px; font-weight: 700; color: #2E7D32;
    }
    .mission-badge {
      background: #FFF; padding: 5px 14px; border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); font-size: 13.5px; font-weight: 700; color: #4A5643;
    }
    .guide-bubble {
      background: #FFF; padding: 6px 16px; border-radius: 999px;
      font-size: 13.5px; font-weight: 600; color: #4A5643;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .btn-sound {
      background: #FFF; border: 1px solid #E8DDD5; width: 38px; height: 38px;
      border-radius: 50%; cursor: pointer; font-size: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: grid; place-items: center;
    }

    /* 메인 과수원 씬 */
    .orchard-stage { flex: 1; position: relative; overflow: hidden; }

    /* 과수원 배경 SVG */
    .orchard-bg-svg {
      position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
    }

    /* 열매 인터랙티브 영역 */
    .fruits-tree-layer {
      position: absolute; inset: 0; z-index: 10;
    }

    .orchard-fruit {
      position: absolute; width: 56px; height: 56px;
      background: transparent; border: 0; cursor: pointer;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.18));
      transition: transform 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 12;
    }
    .orchard-fruit:hover {
      transform: scale(1.25) rotate(-5deg);
    }
    .orchard-fruit.falling {
      pointer-events: none;
      animation: fruitDrop 0.65s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    @keyframes fruitDrop {
      0% { transform: scale(1.15) rotate(0deg); opacity: 1; }
      40% { transform: translate(calc(var(--drop-x) * 0.4), calc(var(--drop-y) * 0.4)) rotate(90deg); }
      80% { transform: translate(var(--drop-x), var(--drop-y)) rotate(180deg); }
      90% { transform: translate(var(--drop-x), calc(var(--drop-y) - 15px)) rotate(200deg); }
      100% { transform: translate(var(--drop-x), var(--drop-y)) rotate(210deg) scale(0.85); opacity: 0; }
    }

    /* 수확 바구니 & 고슴도치 친구 */
    .harvest-cart-station {
      position: absolute; right: 8%; bottom: 6%; width: 220px; height: 140px;
      z-index: 15; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    }
    .cart-svg { width: 140px; height: 90px; filter: drop-shadow(0 6px 14px rgba(0,0,0,0.14)); }
    .cart-items-box {
      position: absolute; bottom: 28px; left: 52px; width: 75px; height: 40px;
      display: flex; flex-wrap: wrap; gap: 3px; align-items: flex-end; pointer-events: none;
    }
    .mini-fruit-chip {
      width: 16px; height: 16px; animation: chipPop 0.3s ease;
    }
    @keyframes chipPop {
      0% { transform: scale(0); }
      60% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    /* 고슴도치 캐릭터 */
    .hedgehog-character {
      position: absolute; left: -25px; bottom: 0; width: 68px; height: 60px;
      transform-origin: bottom center; animation: hedgeWiggle 3s infinite ease-in-out;
    }
    @keyframes hedgeWiggle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(4deg); }
    }
    .hedgehog-character.happy-spin {
      animation: hedgeSpin 0.7s ease;
    }
    @keyframes hedgeSpin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.2) translateY(-20px); }
      100% { transform: rotate(360deg) scale(1); }
    }

    /* 축하 모달 */
    .celebration-overlay {
      position: absolute; inset: 0; background: rgba(30, 45, 20, 0.55);
      backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 50;
    }
    .celebration-overlay[hidden] { display: none; }
    .celebration-card {
      width: min(440px, 90%); background: #FFFDF9; border: 3px solid #81C784;
      border-radius: 24px; padding: 32px 28px; text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }
    .celebration-card h2 { font-size: 24px; color: #2E7D32; margin-bottom: 8px; }
    .celebration-card p { font-size: 14px; color: #6D7768; line-height: 1.55; margin-bottom: 18px; }
    .celebration-stars { font-size: 32px; margin-bottom: 22px; letter-spacing: 4px; }
    .btn-next {
      padding: 11px 26px; background: #4CAF50; color: #FFF; border: 0;
      border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer;
      box-shadow: 0 4px 14px rgba(76, 175, 80, 0.4);
    }
    .btn-next:hover { background: #388E3C; }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="game-canvas">
      <!-- 헤더 -->
      <header class="game-header">
        <div class="header-left">
          <div class="stage-pill" id="stage-pill">1단계: 달콤한 꿀사과 (4개)</div>
          <div class="mission-badge" id="mission-badge">수확량: <strong id="harvest-count">0</strong> <span id="mission-total">/ 4</span></div>
        </div>
        <div class="guide-bubble" id="guide-bubble">
          나무에 주렁주렁 열린 탐스러운 과일을 터치해 수확해보세요! 🍎
        </div>
        <button type="button" class="btn-sound" id="btn-sound-toggle" aria-label="소리 켜기/끄기">🔊</button>
      </header>

      <!-- 과수원 스테이지 -->
      <main class="orchard-stage">
        <!-- 배경 SVG -->
        <svg class="orchard-bg-svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <!-- 언덕 잔디밭 -->
          <path d="M-50 480 Q250 420 500 470 T1050 450 L1050 600 L-50 600 Z" fill="#9CCC65"/>
          <path d="M-50 510 Q200 460 650 510 T1050 490 L1050 600 L-50 600 Z" fill="#8BC34A"/>
          <!-- 커다란 사과·감나무 기둥 -->
          <path d="M420 220 L370 540 Q470 560 560 540 L520 220 Z" fill="#795548"/>
          <!-- 큰 나뭇가지들 -->
          <path d="M440 280 C320 220 180 200 120 230 L110 260 C180 230 320 250 430 320 Z" fill="#6D4C41"/>
          <path d="M500 280 C620 210 780 190 850 220 L860 250 C780 220 620 240 510 320 Z" fill="#6D4C41"/>
          <path d="M470 240 C430 140 460 70 480 30 L520 40 C500 80 480 150 490 240 Z" fill="#6D4C41"/>
          <!-- 풍성한 초록 잎사귀 클러스터 -->
          <ellipse cx="480" cy="110" rx="140" ry="90" fill="#4CAF50" opacity="0.95"/>
          <ellipse cx="280" cy="180" rx="160" ry="100" fill="#43A047" opacity="0.95"/>
          <ellipse cx="680" cy="170" rx="160" ry="100" fill="#4CAF50" opacity="0.95"/>
          <ellipse cx="480" cy="220" rx="180" ry="110" fill="#388E3C" opacity="0.92"/>
          <ellipse cx="360" cy="130" rx="110" ry="70" fill="#66BB6A" opacity="0.88"/>
          <ellipse cx="600" cy="120" rx="110" ry="70" fill="#66BB6A" opacity="0.88"/>
        </svg>

        <!-- 열매들 -->
        <div class="fruits-tree-layer" id="fruits-layer"></div>

        <!-- 수확 상자 및 고슴도치 스테이션 -->
        <div class="harvest-cart-station" id="cart-station">
          <!-- 고슴도치 친구 -->
          <div class="hedgehog-character" id="hedgehog">
            <svg viewBox="0 0 70 60" width="100%" height="100%">
              <!-- 가시 -->
              <path d="M10 40 Q5 15 30 10 Q55 10 50 40 Z" fill="#5D4037"/>
              <path d="M8 35 L2 30 L10 28 L4 20 L14 22 L10 12 L22 18 L24 6 L34 16 L40 4 L46 16 L56 10 L52 22 L62 20 L58 30 L64 36 Z" fill="#4E342E"/>
              <!-- 얼굴 -->
              <path d="M30 25 C45 25 65 32 68 45 C65 52 40 52 30 50 Z" fill="#D7CCC8"/>
              <!-- 코 & 눈 -->
              <circle cx="67" cy="42" r="3.5" fill="#212121"/>
              <circle cx="54" cy="36" r="3" fill="#212121"/>
              <circle cx="55" cy="35" r="1" fill="#FFF"/>
              <!-- 볼터치 -->
              <circle cx="52" cy="43" r="4" fill="#FFAB91" opacity="0.6"/>
              <!-- 발 -->
              <ellipse cx="32" cy="52" rx="5" ry="3" fill="#8D6E63"/>
              <ellipse cx="50" cy="52" rx="5" ry="3" fill="#8D6E63"/>
            </svg>
          </div>

          <!-- 나무 수확 상자 -->
          <svg class="cart-svg" viewBox="0 0 140 90">
            <path d="M15 25 L25 80 L115 80 L125 25 Z" fill="#BCAAA4"/>
            <!-- 나무 널빤지 결 -->
            <path d="M12 25 L128 25 L124 42 L16 42 Z" fill="#A1887F"/>
            <path d="M17 46 L123 46 L119 63 L21 63 Z" fill="#8D6E63"/>
            <path d="M22 67 L118 67 L114 82 L26 82 Z" fill="#6D4C41"/>
            <rect x="42" y="22" width="6" height="62" fill="#4E342E"/>
            <rect x="92" y="22" width="6" height="62" fill="#4E342E"/>
          </svg>
          <!-- 수확된 과일 미니 칩들 -->
          <div class="cart-items-box" id="cart-items"></div>
        </div>

        <!-- 축하 오버레이 -->
        <div class="celebration-overlay" id="celebration-overlay" hidden>
          <div class="celebration-card">
            <div style="font-size:46px; margin-bottom:8px;">🍎 🍊 🧺</div>
            <h2 id="cleared-title">풍성한 가을 수확 완료!</h2>
            <p id="cleared-desc">달콤한 꿀사과와 단감을 정성껏 수확해 상자에 가득 채웠어요!</p>
            <div class="celebration-stars" id="cleared-stars">⭐⭐⭐</div>
            <button type="button" class="btn-next" id="btn-next-stage">다음 과수원으로! ▶</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../shared/game-bridge.js"></script>
  <script>
    (function(){
      'use strict';
      var bridge = window.KinderGameBridge ? window.KinderGameBridge.createGameClient('autumn-orchard') : null;

      var audioCtx = null;
      function getAudioContext() {
        if (!audioCtx) {
          var AudioClass = window.AudioContext || window.webkitAudioContext;
          if (AudioClass) audioCtx = new AudioClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
      }

      function playSound(type) {
        if (bridge && bridge.isMuted()) return;
        try {
          var ctx = getAudioContext();
          if (!ctx) return;
          if (type === 'pluck') {
            // 사과 똑 따는 맑은 톤
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.25, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.2);
          } else if (type === 'land') {
            // 상자에 통 떨어지는 통통 톤
            var o = ctx.createOscillator();
            var g = ctx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(260, ctx.currentTime);
            o.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + 0.15);
            g.gain.setValueAtTime(0.3, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
            o.connect(g); g.connect(ctx.destination);
            o.start(); o.stop(ctx.currentTime + 0.25);
          } else if (type === 'fanfare') {
            [392.00, 523.25, 659.25, 783.99].forEach(function(f, i) {
              var oscF = ctx.createOscillator();
              var gainF = ctx.createGain();
              oscF.type = 'triangle';
              oscF.frequency.setValueAtTime(f, ctx.currentTime + i * 0.12);
              gainF.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.12);
              gainF.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.4);
              oscF.connect(gainF); gainF.connect(ctx.destination);
              oscF.start(ctx.currentTime + i * 0.12);
              oscF.stop(ctx.currentTime + i * 0.12 + 0.4);
            });
          }
        } catch(_) {}
      }

      var FRUIT_SVGS = {
        apple: `
          <svg viewBox="0 0 54 54" width="100%" height="100%">
            <!-- 꼭지 & 잎 -->
            <path d="M27 4 C27 4 28 14 27 16" stroke="#4E342E" stroke-width="3" stroke-linecap="round"/>
            <path d="M28 8 Q38 4 40 10 Q32 14 28 8 Z" fill="#66BB6A"/>
            <!-- 사과 알맹이 -->
            <path d="M27 16 C12 14 4 28 12 42 C18 52 24 50 27 46 C30 50 36 52 42 42 C50 28 42 14 27 16 Z" fill="#E53935"/>
            <!-- 하이라이트 -->
            <ellipse cx="18" cy="24" rx="4" ry="7" fill="#FFCDD2" opacity="0.6" transform="rotate(-25 18 24)"/>
          </svg>
        `,
        persimmon: `
          <svg viewBox="0 0 54 54" width="100%" height="100%">
            <!-- 감 꼭지 4잎 -->
            <path d="M27 6 L27 14 M18 10 Q27 14 22 18 M36 10 Q27 14 32 18 M27 6 Q20 14 27 15" stroke="#33691E" stroke-width="2.5" fill="#558B2F"/>
            <!-- 감 알맹이 -->
            <path d="M27 14 C12 14 6 26 12 42 C18 52 36 52 42 42 C48 26 42 14 27 14 Z" fill="#FB8C00"/>
            <!-- 하이라이트 -->
            <ellipse cx="20" cy="26" rx="4" ry="6" fill="#FFE0B2" opacity="0.65" transform="rotate(-20 20 26)"/>
          </svg>
        `
      };

      var STAGES = [
        { name: '1단계: 달콤한 꿀사과 (4개)', apples: 4, persimmons: 0, stars: '⭐☆☆' },
        { name: '2단계: 사과와 단감 수확 (7개)', apples: 4, persimmons: 3, stars: '⭐⭐☆' },
        { name: '3단계: 풍성한 과수원 대축제 (10개)', apples: 5, persimmons: 5, stars: '⭐⭐⭐' }
      ];

      var currentStage = 0;
      var harvested = 0;
      var targetTotal = 0;

      var fruitsLayer = document.getElementById('fruits-layer');
      var harvestCountText = document.getElementById('harvest-count');
      var missionTotalText = document.getElementById('mission-total');
      var guideBubble = document.getElementById('guide-bubble');
      var stagePill = document.getElementById('stage-pill');
      var cartItems = document.getElementById('cart-items');
      var hedgehog = document.getElementById('hedgehog');
      var overlay = document.getElementById('celebration-overlay');
      var btnNext = document.getElementById('btn-next-stage');
      var btnSound = document.getElementById('btn-sound-toggle');

      function startStage(stageIdx) {
        currentStage = stageIdx % STAGES.length;
        var s = STAGES[currentStage];
        harvested = 0;
        targetTotal = s.apples + s.persimmons;

        stagePill.textContent = s.name;
        harvestCountText.textContent = '0';
        missionTotalText.textContent = '/ ' + targetTotal;
        guideBubble.textContent = '나무에 주렁주렁 열린 탐스러운 과일을 터치해 수확해보세요! 🍎';
        cartItems.innerHTML = '';
        overlay.hidden = true;
        fruitsLayer.innerHTML = '';

        // 열매 생성 위치 (나뭇가지 영역)
        var slots = [
          { x: 18, y: 15 }, { x: 28, y: 12 }, { x: 38, y: 8 }, { x: 48, y: 12 },
          { x: 58, y: 8 }, { x: 68, y: 14 }, { x: 78, y: 18 }, { x: 24, y: 24 },
          { x: 36, y: 22 }, { x: 48, y: 26 }, { x: 62, y: 24 }, { x: 72, y: 26 }
        ];
        slots.sort(function() { return Math.random() - 0.5; });

        var fruitItems = [];
        for (var i = 0; i < s.apples; i++) fruitItems.push('apple');
        for (var j = 0; j < s.persimmons; j++) fruitItems.push('persimmon');
        fruitItems.sort(function() { return Math.random() - 0.5; });

        fruitItems.forEach(function(type, idx) {
          var pos = slots[idx % slots.length];
          var fruitBtn = document.createElement('button');
          fruitBtn.type = 'button';
          fruitBtn.className = 'orchard-fruit';
          fruitBtn.dataset.type = type;
          fruitBtn.style.left = (pos.x + (Math.random() * 4 - 2)) + '%';
          fruitBtn.style.top = (pos.y + (Math.random() * 4 - 2)) + '%';
          fruitBtn.innerHTML = FRUIT_SVGS[type];

          fruitBtn.addEventListener('click', function() {
            if (fruitBtn.classList.contains('falling')) return;
            harvestFruit(fruitBtn, type);
          });

          fruitsLayer.appendChild(fruitBtn);
        });
      }

      function harvestFruit(fruitBtn, type) {
        playSound('pluck');
        fruitBtn.classList.add('falling');

        var cartStation = document.getElementById('cart-station');
        var fruitRect = fruitBtn.getBoundingClientRect();
        var cartRect = cartStation.getBoundingClientRect();

        var dropX = (cartRect.left + cartRect.width / 2) - (fruitRect.left + fruitRect.width / 2);
        var dropY = (cartRect.top + cartRect.height / 2) - (fruitRect.top + fruitRect.height / 2);

        fruitBtn.style.setProperty('--drop-x', dropX + 'px');
        fruitBtn.style.setProperty('--drop-y', dropY + 'px');

        harvested++;
        harvestCountText.textContent = harvested;

        var nameStr = type === 'apple' ? '사과' : '단감';
        guideBubble.textContent = '달콤한 ' + nameStr + '를 톡! 수확 상자에 쏙 들어갔어요!';

        // 고슴도치 반응
        hedgehog.classList.remove('happy-spin');
        void hedgehog.offsetWidth;
        hedgehog.classList.add('happy-spin');

        setTimeout(function() {
          playSound('land');
          var chip = document.createElement('div');
          chip.className = 'mini-fruit-chip';
          chip.innerHTML = FRUIT_SVGS[type];
          cartItems.appendChild(chip);
        }, 550);

        if (harvested >= targetTotal) {
          setTimeout(showStageClear, 850);
        }
      }

      function showStageClear() {
        playSound('fanfare');
        var s = STAGES[currentStage];
        overlay.hidden = false;
        document.getElementById('cleared-title').textContent = s.name + ' 대성공!';
        document.getElementById('cleared-desc').textContent = '맛있는 가을 열매 ' + targetTotal + '개를 상자 가득 모두 수확했어요!';
        document.getElementById('cleared-stars').textContent = s.stars;

        if (currentStage >= STAGES.length - 1) {
          btnNext.textContent = '처음부터 다시 하기 🌟';
        } else {
          btnNext.textContent = '다음 과수원으로! ▶';
        }

        if (bridge) bridge.reportScore(targetTotal * 100);
      }

      btnNext.addEventListener('click', function() {
        if (currentStage >= STAGES.length - 1) {
          startStage(0);
        } else {
          startStage(currentStage + 1);
        }
      });

      btnSound.addEventListener('click', function() {
        var muted = (bridge && typeof bridge.toggleSound === 'function') ? bridge.toggleSound() : false;
        btnSound.textContent = muted ? '🔇' : '🔊';
      });

      if (bridge && typeof bridge.onRestart === 'function') {
        bridge.onRestart(function() { startStage(0); });
      }
      if (bridge && typeof bridge.onMuteChange === 'function') {
        bridge.onMuteChange(function(muted) { btnSound.textContent = muted ? '🔇' : '🔊'; });
      }

      startStage(0);
    })();
  </script>
</body>
</html>
