<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>가을 과수원 열매 수확 | 지니쌤의 킨더에듀</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="game-wrapper">
    <div class="game-canvas">
      <!-- 헤더 바 -->
      <header class="game-header">
        <div class="header-left">
          <div class="stage-pill" id="stage-pill">1단계: 달콤한 꿀사과 (4개)</div>
          <div class="mission-badge" id="mission-badge">수확량: <strong id="harvest-count">0</strong> <span id="mission-total">/ 4</span></div>
        </div>
        <div class="guide-bubble" id="guide-bubble">
          나무에 주렁주렁 열린 탐스러운 과일을 터치해 수확해보세요! 🍎
        </div>
        <button type="button" class="btn-sound" id="btn-sound-toggle" aria-label="소리 켜기/끄기">🔊</button>
      </header>

      <!-- 과수원 스테이지 -->
      <main class="orchard-stage">
        <!-- 수채화 가을 숲/과수원 배경 -->
        <img src="./assets/bg.jpg" alt="가을 과수원 풍경" class="scene-bg-img">

        <!-- 햇살 효과 -->
        <div class="sunlight-beam"></div>

        <!-- 열매 인터랙티브 레이어 -->
        <div class="fruits-tree-layer" id="fruits-tree-layer"></div>

        <!-- 하단 수확 바구니 & 응원 다람쥐 친구 -->
        <div class="harvest-station" id="harvest-station">
          <!-- 응원 다람쥐 캐릭터 -->
          <div class="orchard-companion" id="orchard-companion">
            <div class="companion-speech" id="companion-speech">열매를 따줘! 🍎</div>
            <img src="./assets/squirrel.png" alt="응원 다람쥐" class="companion-wc-img">
          </div>

          <!-- 수확 바구니 -->
          <div class="basket-station-box" id="basket-station-box">
            <img src="./assets/basket.png" alt="과일 수확 바구니" class="basket-wc-img">
            <div class="basket-fill-fruits" id="basket-fill-fruits"></div>
          </div>
        </div>

        <!-- 성공 축하 오버레이 모달 -->
        <div class="celebration-overlay" id="celebration-overlay" hidden>
          <div class="celebration-card">
            <div class="celebration-badge">🎉 수확 대성공! 🎉</div>
            <h2 id="cleared-title">가을 과수원 수확 완성!</h2>
            <p id="cleared-desc">달콤한 가을 열매들을 바구니 가득 모았어요! 숲속 친구들과 맛있게 나누어 먹어요.</p>
            <div class="celebration-stars" id="cleared-stars">⭐⭐⭐</div>
            <button type="button" class="btn-next" id="btn-next-stage">다음 단계로! ▶</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../shared/game-bridge.js"></script>
  <script src="./src/game.js"></script>
</body>
</html>
