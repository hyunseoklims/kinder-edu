<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>허수아비 카드 짝맞추기 | 지니쌤의 킨더에듀</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="game-wrapper">
    <div class="game-canvas">
      <!-- 상단 헤더 -->
      <header class="game-header">
        <div class="header-left">
          <div class="stage-pill" id="stage-pill">1단계: 황금 들판 (3쌍)</div>
          <div class="pairs-badge">찾은 짝: <strong id="matched-count">0</strong> <span id="pairs-total">/ 3</span></div>
        </div>
        <div class="guide-bubble" id="guide-bubble">
          카드를 2장씩 뒤집어 같은 가을 그림 짝을 찾아보세요! 🌾
        </div>
        <button type="button" class="btn-sound" id="btn-sound-toggle" aria-label="소리 켜기/끄기">🔊</button>
      </header>

      <!-- 메인 메모리 게임 무대 -->
      <main class="memory-stage">
        <!-- 수채화 가을 들판 배경 -->
        <img src="./assets/bg.jpg" alt="가을 황금빛 들판" class="scene-bg-img">

        <!-- 좌측 친근한 허수아비 아저씨 (Rule 2) -->
        <div class="scarecrow-pane">
          <div class="scarecrow-bubble" id="scarecrow-bubble">같은 짝을 찾아봐! 🌾</div>
          <svg class="scarecrow-art" id="scarecrow-art" viewBox="0 0 160 220" role="img" aria-label="다정한 허수아비">
            <!-- 허수아비 나무 기둥 및 가로대 -->
            <rect x="76" y="80" width="8" height="135" rx="3" fill="#6D4C41"/>
            <rect x="25" y="105" width="110" height="7" rx="3" fill="#8D6E63"/>
            <!-- 짚단 삐져나온 손/소매 -->
            <path d="M22 104 L10 98 M22 108 L8 106 M22 112 L10 116" stroke="#FBC02D" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M138 104 L150 98 M138 108 L152 106 M138 112 L150 116" stroke="#FBC02D" stroke-width="2.5" stroke-linecap="round"/>
            <!-- 누더기 체크 셔츠 -->
            <path d="M50 95 L110 95 L120 155 L40 155 Z" fill="#E65100"/>
            <!-- 멜빵바지 -->
            <path d="M55 130 L105 130 L108 175 L52 175 Z" fill="#1565C0"/>
            <rect x="62" y="100" width="8" height="35" fill="#0D47A1"/>
            <rect x="90" y="100" width="8" height="35" fill="#0D47A1"/>
            <!-- 노란 패치워크 헝겊 -->
            <rect x="80" y="142" width="14" height="14" rx="2" fill="#FDD835"/>
            <path d="M80 142 L94 156 M94 142 L80 156" stroke="#795548" stroke-width="1" opacity="0.6"/>
            <!-- 둥근 얼굴 -->
            <circle cx="80" cy="65" r="24" fill="#FFE0B2"/>
            <!-- 얼굴 표정 (웃는 눈, 당근 코, 스티치 입) -->
            <path d="M70 60 Q73 56 76 60" stroke="#4E342E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M84 60 Q87 56 90 60" stroke="#4E342E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <polygon points="80,62 76,70 84,70" fill="#FB8C00"/>
            <path d="M72 75 Q80 81 88 75" stroke="#4E342E" stroke-width="2" fill="none" stroke-linecap="round"/>
            <line x1="75" y1="75" x2="75" y2="78" stroke="#4E342E" stroke-width="1.5"/>
            <line x1="80" y1="77" x2="80" y2="80" stroke="#4E342E" stroke-width="1.5"/>
            <line x1="85" y1="75" x2="85" y2="78" stroke="#4E342E" stroke-width="1.5"/>
            <!-- 붉은 볼터치 -->
            <ellipse cx="69" cy="68" rx="4" ry="2.5" fill="#FF8A80" opacity="0.6"/>
            <ellipse cx="91" cy="68" rx="4" ry="2.5" fill="#FF8A80" opacity="0.6"/>
            <!-- 밀짚모자 -->
            <path d="M45 48 C55 35 105 35 115 48 L126 52 C128 53 126 56 122 55 L38 55 C34 56 32 53 34 52 Z" fill="#FBC02D"/>
            <path d="M56 46 C58 24 102 24 104 46 Z" fill="#F9A825"/>
            <rect x="56" y="44" width="48" height="5" fill="#C62828"/>
            <!-- 모자 위 참새 친구 -->
            <ellipse cx="98" cy="22" rx="7" ry="5" fill="#8D6E63"/>
            <circle cx="103" cy="19" r="4" fill="#A1887F"/>
            <polygon points="107,19 111,20 107,22" fill="#FFA000"/>
            <circle cx="104" cy="18" r="0.8" fill="#000"/>
          </svg>
        </div>

        <!-- 우측 카드 뒤집기 무대 -->
        <div class="cards-board-container">
          <div class="cards-grid-pane" id="cards-grid"></div>
        </div>

        <!-- 축하 모달 -->
        <div class="celebration-overlay" id="celebration-overlay" hidden>
          <div class="celebration-card">
            <div class="celebration-badge">🎉 짝맞추기 완성! 🎉</div>
            <h2 id="cleared-title">허수아비 축제 완성!</h2>
            <p id="cleared-desc">가을 낱말 카드 짝을 모두 찾았어요! 허수아비 아저씨가 신나서 춤을 춰요!</p>
            <div class="celebration-stars" id="cleared-stars">⭐⭐⭐</div>
            <button type="button" class="btn-next" id="btn-next-stage">다음 단계로! ▶</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../shared/game-bridge.js"></script>
  <script src="./src/game.js"></script>
</body>
</html>
