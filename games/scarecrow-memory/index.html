<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>허수아비 카드 짝맞추기 | Kinder Edu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #FAF4E5; font-family: 'Pretendard', -apple-system, sans-serif;
      color: #2E2E2E;
    }
    .game-wrapper {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 8px;
    }
    .game-canvas {
      width: 100%; max-width: 1000px; height: 100%; max-height: 660px; aspect-ratio: 1000 / 660;
      border-radius: 20px; box-shadow: 0 16px 45px rgba(110, 85, 45, 0.16);
      position: relative; overflow: hidden; display: flex; flex-direction: column;
      background: linear-gradient(180deg, #FFF8EC 0%, #FEEEC8 50%, #F5DC9A 100%);
    }

    /* 상단 헤더 */
    .game-header {
      height: 56px; padding: 8px 18px; display: flex; align-items: center; justify-content: space-between;
      background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(220, 190, 150, 0.35); z-index: 20;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .stage-pill {
      background: #FFF3D6; border: 1px solid #ECC472; padding: 4px 12px; border-radius: 999px;
      font-size: 13px; font-weight: 700; color: #8C5512;
    }
    .pairs-badge {
      background: #FFF; padding: 5px 14px; border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); font-size: 13.5px; font-weight: 700;
    }
    .pairs-badge strong { color: #D47A2A; font-size: 16px; }
    .guide-bubble {
      background: #FFF; padding: 6px 16px; border-radius: 999px;
      font-size: 13.5px; font-weight: 600; color: #5C4A38;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .btn-sound {
      background: #FFF; border: 1px solid #E8DDD5; width: 38px; height: 38px;
      border-radius: 50%; cursor: pointer; font-size: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: grid; place-items: center;
    }

    /* 메인 무대 레이아웃 (좌측 허수아비 + 우측 카드 그리드) */
    .memory-stage {
      flex: 1; position: relative; display: flex; padding: 16px 24px; gap: 20px;
    }

    /* 좌측 허수아비 캐릭터 영역 */
    .scarecrow-pane {
      width: 170px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      position: relative; z-index: 5;
    }
    .scarecrow-art {
      width: 150px; height: 260px; transform-origin: bottom center;
      animation: scarecrowSway 4s ease-in-out infinite;
    }
    @keyframes scarecrowSway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(3deg); }
    }
    .scarecrow-art.cheer {
      animation: scarecrowCheer 0.6s ease;
    }
    @keyframes scarecrowCheer {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-24px) scale(1.08); }
    }

    .scarecrow-bubble {
      background: #FFF; border: 2px solid #E2AC52; border-radius: 14px;
      padding: 6px 12px; font-size: 12.5px; font-weight: 700; color: #6D4212;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 8px; text-align: center;
      white-space: nowrap;
    }

    /* 우측 카드 그리드 영역 */
    .cards-grid-pane {
      flex: 1; display: grid; align-content: center; justify-content: center;
      gap: 14px; perspective: 1000px;
    }
    .cards-grid-pane.cols-3 { grid-template-columns: repeat(3, 115px); }
    .cards-grid-pane.cols-4 { grid-template-columns: repeat(4, 110px); }

    /* 3D 플립 카드 */
    .card-slot {
      width: 110px; height: 135px; cursor: pointer; perspective: 1000px;
      transition: transform 0.15s ease;
    }
    .card-slot:hover { transform: scale(1.04); }
    .card-slot.matched { pointer-events: none; }

    .card-flipper {
      width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      border-radius: 14px; box-shadow: 0 6px 16px rgba(110,85,45,0.12);
    }
    .card-slot.flipped .card-flipper,
    .card-slot.matched .card-flipper {
      transform: rotateY(180deg);
    }
    .card-slot.matched .card-flipper {
      box-shadow: 0 0 0 3px #81C784, 0 8px 20px rgba(76,175,80,0.25);
    }

    .card-side {
      position: absolute; inset: 0; backface-visibility: hidden; border-radius: 14px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    /* 카드 뒷면 (허수아비 패턴) */
    .card-back {
      background: linear-gradient(135deg, #DE9E3E 0%, #C48225 100%);
      border: 3px solid #FFF; color: #FFF;
    }
    .card-back-svg { width: 44px; height: 44px; opacity: 0.9; }

    /* 카드 앞면 (그림 & 글자) */
    .card-front {
      background: #FFF; transform: rotateY(180deg); border: 3px solid #E2B258;
      padding: 6px;
    }
    .card-front-svg { width: 56px; height: 56px; }
    .card-label {
      font-size: 13px; font-weight: 800; color: #5C4A38; margin-top: 4px;
    }

    /* 축하 모달 */
    .celebration-overlay {
      position: absolute; inset: 0; background: rgba(35, 25, 10, 0.55);
      backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 50;
    }
    .celebration-overlay[hidden] { display: none; }
    .celebration-card {
      width: min(440px, 90%); background: #FFFDF9; border: 3px solid #DFB64F;
      border-radius: 24px; padding: 32px 28px; text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }
    .celebration-card h2 { font-size: 24px; color: #D47A2A; margin-bottom: 8px; }
    .celebration-card p { font-size: 14px; color: #7E7872; line-height: 1.55; margin-bottom: 18px; }
    .celebration-stars { font-size: 32px; margin-bottom: 22px; letter-spacing: 4px; }
    .btn-next {
      padding: 11px 26px; background: #DFB64F; color: #FFF; border: 0;
      border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer;
      box-shadow: 0 4px 14px rgba(223, 182, 79, 0.4);
    }
    .btn-next:hover { background: #CA9F32; }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="game-canvas">
      <!-- 헤더 -->
      <header class="game-header">
        <div class="header-left">
          <div class="stage-pill" id="stage-pill">1단계: 황금 들판 짝맞추기 (3쌍)</div>
          <div class="pairs-badge">
            찾은 짝: <strong id="matched-count">0</strong> <span id="pairs-total">/ 3</span>
          </div>
        </div>
        <div class="guide-bubble" id="guide-bubble">
          카드를 2장씩 뒤집어 같은 가을 그림 짝을 찾아보세요! 🌾
        </div>
        <button type="button" class="btn-sound" id="btn-sound-toggle" aria-label="소리 켜기/끄기">🔊</button>
      </header>

      <!-- 메인 씬 -->
      <main class="memory-stage">
        <!-- 좌측 허수아비 -->
        <div class="scarecrow-pane">
          <div class="scarecrow-bubble" id="scarecrow-bubble">같은 짝을 찾아봐! 🌾</div>
          <div class="scarecrow-art" id="scarecrow">
            <svg viewBox="0 0 150 260" width="100%" height="100%">
              <!-- 밀짚모자 -->
              <ellipse cx="75" cy="50" rx="48" ry="12" fill="#E2AC52"/>
              <path d="M50 48 C50 25 100 25 100 48 Z" fill="#D3983B"/>
              <rect x="52" y="44" width="46" height="5" fill="#E53935"/>
              <!-- 머리 -->
              <circle cx="75" cy="72" r="22" fill="#F8E3C3"/>
              <!-- 얼굴 (스티치 단추눈 & 따뜻한 미소) -->
              <circle cx="68" cy="70" r="3" fill="#3E2723"/>
              <circle cx="82" cy="70" r="3" fill="#3E2723"/>
              <path d="M70 80 Q75 86 80 80" stroke="#3E2723" stroke-width="2.5" fill="none" stroke-linecap="round"/>
              <circle cx="64" cy="76" r="4" fill="#FF8A80" opacity="0.6"/>
              <circle cx="86" cy="76" r="4" fill="#FF8A80" opacity="0.6"/>
              <!-- 체크 셔츠 몸통 -->
              <path d="M42 92 L108 92 L115 160 L35 160 Z" fill="#42A5F5"/>
              <path d="M35 110 L115 110 M35 130 L115 130 M35 150 L115 150 M55 92 L55 160 M75 92 L75 160 M95 92 L95 160" stroke="#1E88E5" stroke-width="2" opacity="0.5"/>
              <!-- 멜빵바지 -->
              <path d="M45 155 L105 155 L108 200 L42 200 Z" fill="#5C6BC0"/>
              <!-- 나무 지지대 기둥 -->
              <rect x="71" y="195" width="8" height="65" fill="#8D6E63"/>
              <!-- 벌린 양팔 나무막대 -->
              <rect x="8" y="105" width="134" height="7" fill="#8D6E63"/>
              <!-- 참새 친구 -->
              <g transform="translate(18, 86)">
                <ellipse cx="12" cy="12" rx="10" ry="8" fill="#8D6E63"/>
                <circle cx="16" cy="10" r="1.5" fill="#000"/>
                <polygon points="22,10 26,12 22,14" fill="#FFA000"/>
              </g>
            </svg>
          </div>
        </div>

        <!-- 우측 카드 그리드 -->
        <div class="cards-grid-pane cols-3" id="cards-grid"></div>

        <!-- 축하 오버레이 -->
        <div class="celebration-overlay" id="celebration-overlay" hidden>
          <div class="celebration-card">
            <div style="font-size:46px; margin-bottom:8px;">🎉 🌾 🎈</div>
            <h2 id="cleared-title">기억력 대장! 짝맞추기 완성!</h2>
            <p id="cleared-desc">허수아비 옷에 걸린 가을 카드들의 짝을 모두 찾았어요!</p>
            <div class="celebration-stars" id="cleared-stars">⭐⭐⭐</div>
            <button type="button" class="btn-next" id="btn-next-stage">다음 단계로! ▶</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../shared/game-bridge.js"></script>
  <script>
    (function(){
      'use strict';
      var bridge = window.KinderGameBridge ? window.KinderGameBridge.createGameClient('scarecrow-memory') : null;

      var audioCtx = null;
      function getAudioContext() {
        if (!audioCtx) {
          var AudioClass = window.AudioContext || window.webkitAudioContext;
          if (AudioClass) audioCtx = new AudioClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
      }

      function playSound(type) {
        if (bridge && bridge.isMuted()) return;
        try {
          var ctx = getAudioContext();
          if (!ctx) return;
          if (type === 'flip') {
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(320, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(540, ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.15);
          } else if (type === 'match') {
            [440, 554.37, 659.25].forEach(function(f, i) {
              var o = ctx.createOscillator();
              var g = ctx.createGain();
              o.type = 'triangle';
              o.frequency.setValueAtTime(f, ctx.currentTime + i * 0.08);
              g.gain.setValueAtTime(0.25, ctx.currentTime + i * 0.08);
              g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.35);
              o.connect(g); g.connect(ctx.destination);
              o.start(ctx.currentTime + i * 0.08);
              o.stop(ctx.currentTime + i * 0.08 + 0.35);
            });
          } else if (type === 'mismatch') {
            var oscM = ctx.createOscillator();
            var gainM = ctx.createGain();
            oscM.type = 'sine';
            oscM.frequency.setValueAtTime(220, ctx.currentTime);
            gainM.gain.setValueAtTime(0.18, ctx.currentTime);
            gainM.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
            oscM.connect(gainM); gainM.connect(ctx.destination);
            oscM.start(); oscM.stop(ctx.currentTime + 0.25);
          } else if (type === 'fanfare') {
            [523.25, 659.25, 783.99, 1046.50].forEach(function(f, i) {
              var oscF = ctx.createOscillator();
              var gainF = ctx.createGain();
              oscF.type = 'triangle';
              oscF.frequency.setValueAtTime(f, ctx.currentTime + i * 0.1);
              gainF.gain.setValueAtTime(0.22, ctx.currentTime + i * 0.1);
              gainF.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.4);
              oscF.connect(gainF); gainF.connect(ctx.destination);
              oscF.start(ctx.currentTime + i * 0.1);
              oscF.stop(ctx.currentTime + i * 0.1 + 0.4);
            });
          }
        } catch(_) {}
      }

      // 카드 일러스트 SVG들
      var CARD_ITEMS = {
        chestnut: {
          label: '알밤 🌰',
          svg: '<svg class="card-front-svg" viewBox="0 0 50 50"><path d="M25 6 C15 6 6 18 10 36 C13 46 37 46 40 36 C44 18 35 6 25 6 Z" fill="#8D5524"/><path d="M10 36 C13 46 37 46 40 36 C34 32 16 32 10 36 Z" fill="#D7A15C"/></svg>'
        },
        apple: {
          label: '꿀사과 🍎',
          svg: '<svg class="card-front-svg" viewBox="0 0 50 50"><path d="M25 6 C25 6 26 12 25 14" stroke="#4E342E" stroke-width="2.5"/><path d="M25 14 C12 12 5 25 12 38 C18 48 23 46 25 42 C27 46 32 48 38 38 C45 25 38 12 25 14 Z" fill="#E53935"/></svg>'
        },
        pumpkin: {
          label: '호박 🎃',
          svg: '<svg class="card-front-svg" viewBox="0 0 50 50"><rect x="23" y="4" width="4" height="8" rx="2" fill="#558B2F"/><ellipse cx="25" cy="28" rx="20" ry="16" fill="#FB8C00"/><ellipse cx="25" cy="28" rx="13" ry="16" fill="#F57C00"/><ellipse cx="25" cy="28" rx="6" ry="16" fill="#EF6C00"/></svg>'
        },
        rice: {
          label: '벼이삭 🌾',
          svg: '<svg class="card-front-svg" viewBox="0 0 50 50"><path d="M12 45 Q25 35 38 10" stroke="#FBC02D" stroke-width="3" fill="none"/><ellipse cx="26" cy="28" rx="4" ry="7" fill="#FBC02D" transform="rotate(25 26 28)"/><ellipse cx="32" cy="20" rx="4" ry="7" fill="#FBC02D" transform="rotate(35 32 20)"/><ellipse cx="37" cy="12" rx="4" ry="7" fill="#FBC02D" transform="rotate(45 37 12)"/></svg>'
        },
        dragonfly: {
          label: '잠자리 蜻',
          svg: '<svg class="card-front-svg" viewBox="0 0 50 50"><line x1="25" y1="8" x2="25" y2="44" stroke="#E53935" stroke-width="3.5" stroke-linecap="round"/><circle cx="25" cy="8" r="4" fill="#C62828"/><ellipse cx="14" cy="18" rx="10" ry="3.5" fill="#80DEEA" opacity="0.8" transform="rotate(-15 14 18)"/><ellipse cx="36" cy="18" rx="10" ry="3.5" fill="#80DEEA" opacity="0.8" transform="rotate(15 36 18)"/></svg>'
        },
        mushroom: {
          label: '버섯 🍄',
          svg: '<svg class="card-front-svg" viewBox="0 0 50 50"><rect x="21" y="24" width="8" height="20" rx="4" fill="#FFF9C4"/><path d="M10 26 C10 12 40 12 40 26 Z" fill="#E53935"/><circle cx="20" cy="18" r="2.5" fill="#FFF"/><circle cx="30" cy="18" r="2.5" fill="#FFF"/></svg>'
        }
      };

      var STAGES = [
        { name: '1단계: 황금 들판 (3쌍, 6장)', pairs: ['chestnut', 'apple', 'pumpkin'], cols: 3, stars: '⭐☆☆' },
        { name: '2단계: 가을 길목 (4쌍, 8장)', pairs: ['chestnut', 'apple', 'pumpkin', 'rice'], cols: 4, stars: '⭐⭐☆' },
        { name: '3단계: 허수아비 축제 (6쌍, 12장)', pairs: ['chestnut', 'apple', 'pumpkin', 'rice', 'dragonfly', 'mushroom'], cols: 4, stars: '⭐⭐⭐' }
      ];

      var currentStage = 0;
      var flippedCards = [];
      var matchedPairs = 0;
      var lockBoard = false;

      var gridEl = document.getElementById('cards-grid');
      var matchedCountEl = document.getElementById('matched-count');
      var pairsTotalEl = document.getElementById('pairs-total');
      var stagePill = document.getElementById('stage-pill');
      var guideBubble = document.getElementById('guide-bubble');
      var scarecrowBubble = document.getElementById('scarecrow-bubble');
      var scarecrow = document.getElementById('scarecrow');
      var overlay = document.getElementById('celebration-overlay');
      var btnNext = document.getElementById('btn-next-stage');
      var btnSound = document.getElementById('btn-sound-toggle');

      function startStage(stageIdx) {
        currentStage = stageIdx % STAGES.length;
        var s = STAGES[currentStage];
        matchedPairs = 0;
        flippedCards = [];
        lockBoard = false;

        stagePill.textContent = s.name;
        matchedCountEl.textContent = '0';
        pairsTotalEl.textContent = '/ ' + s.pairs.length;
        guideBubble.textContent = '카드를 2장씩 뒤집어 같은 가을 그림 짝을 찾아보세요! 🌾';
        scarecrowBubble.textContent = '같은 짝을 찾아봐! 🌾';
        overlay.hidden = true;

        gridEl.className = 'cards-grid-pane cols-' + s.cols;
        gridEl.innerHTML = '';

        // 카드 덱 생성 (쌍으로 복제)
        var deck = [];
        s.pairs.forEach(function(key) {
          deck.push({ key: key, info: CARD_ITEMS[key] });
          deck.push({ key: key, info: CARD_ITEMS[key] });
        });
        deck.sort(function() { return Math.random() - 0.5; });

        deck.forEach(function(item, idx) {
          var slot = document.createElement('div');
          slot.className = 'card-slot';
          slot.dataset.key = item.key;
          slot.dataset.idx = idx;

          slot.innerHTML = `
            <div class="card-flipper">
              <div class="card-side card-back">
                <svg class="card-back-svg" viewBox="0 0 40 40">
                  <circle cx="20" cy="20" r="14" fill="#F5B041" opacity="0.8"/>
                  <path d="M20 6 L20 34 M6 20 L34 20 M10 10 L30 30 M10 30 L30 10" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
              </div>
              <div class="card-side card-front">
                ${item.info.svg}
                <span class="card-label">${item.info.label}</span>
              </div>
            </div>
          `;

          slot.addEventListener('click', function() {
            handleCardClick(slot);
          });

          gridEl.appendChild(slot);
        });
      }

      function handleCardClick(slot) {
        if (lockBoard || slot.classList.contains('flipped') || slot.classList.contains('matched')) return;

        playSound('flip');
        slot.classList.add('flipped');
        flippedCards.push(slot);

        if (flippedCards.length === 2) {
          checkPair();
        }
      }

      function checkPair() {
        lockBoard = true;
        var c1 = flippedCards[0];
        var c2 = flippedCards[1];
        var s = STAGES[currentStage];

        if (c1.dataset.key === c2.dataset.key) {
          // 정답 매칭!
          playSound('match');
          setTimeout(function() {
            c1.classList.add('matched');
            c2.classList.add('matched');
            flippedCards = [];
            lockBoard = false;
            matchedPairs++;
            matchedCountEl.textContent = matchedPairs;

            scarecrow.classList.remove('cheer');
            void scarecrow.offsetWidth;
            scarecrow.classList.add('cheer');
            scarecrowBubble.textContent = '와! 짝을 찾았어! 🎉';
            guideBubble.textContent = '멋져요! 같은 그림 짝을 발견했어요!';

            if (matchedPairs >= s.pairs.length) {
              setTimeout(showStageClear, 600);
            }
          }, 400);
        } else {
          // 짝이 다름
          playSound('mismatch');
          scarecrowBubble.textContent = '다시 한 번 뒤집어봐!';
          setTimeout(function() {
            c1.classList.remove('flipped');
            c2.classList.remove('flipped');
            flippedCards = [];
            lockBoard = false;
          }, 850);
        }
      }

      function showStageClear() {
        playSound('fanfare');
        var s = STAGES[currentStage];
        overlay.hidden = false;
        document.getElementById('cleared-title').textContent = s.name + ' 완성!';
        document.getElementById('cleared-desc').textContent = '기억력 대장! 가을 낱말 카드 짝을 모두 찾았어요!';
        document.getElementById('cleared-stars').textContent = s.stars;

        if (currentStage >= STAGES.length - 1) {
          btnNext.textContent = '처음부터 다시 하기 🌟';
        } else {
          btnNext.textContent = '다음 단계로! ▶';
        }

        if (bridge) bridge.reportScore(s.pairs.length * 100);
      }

      btnNext.addEventListener('click', function() {
        if (currentStage >= STAGES.length - 1) {
          startStage(0);
        } else {
          startStage(currentStage + 1);
        }
      });

      btnSound.addEventListener('click', function() {
        var muted = (bridge && typeof bridge.toggleSound === 'function') ? bridge.toggleSound() : false;
        btnSound.textContent = muted ? '🔇' : '🔊';
      });

      if (bridge && typeof bridge.onRestart === 'function') {
        bridge.onRestart(function() { startStage(0); });
      }
      if (bridge && typeof bridge.onMuteChange === 'function') {
        bridge.onMuteChange(function(muted) { btnSound.textContent = muted ? '🔇' : '🔊'; });
      }

      startStage(0);
    })();
  </script>
</body>
</html>
